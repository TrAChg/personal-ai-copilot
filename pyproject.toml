[project]
name = "personal-copilot"
version = "2.0.0"
description = "Personal Second-Brain Hub: ChromaDB HNSW, GraphRAG, and Autonomous Engineering Lakehouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.4.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_copilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
explicit_package_bases = true
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "BLE001",  # blind exception catch in resilience fallbacks
    "DTZ",     # naive datetime for local activity logging
    "S110",    # pass inside try-except
    "PLW1510", # subprocess check argument
]

